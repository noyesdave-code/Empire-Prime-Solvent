name: Deploy to GitHub Pages
# redeploy trigger: 2026-05-31 empire-hard-refresh

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_ENV: production
  VITE_SUPABASE_URL: https://lkzxpvleikvvbuhmsgaa.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hSVlNSRqpzHDV_QFu5ODIw_fXSmFwbz
  VITE_SUPABASE_PROJECT_ID: lkzxpvleikvvbuhmsgaa
  VITE_PAYMENTS_CLIENT_TOKEN: live_821a1eef30c4b062032f6b6138f

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies from package.json
        shell: bash
        run: npm install --include=dev
      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - name: SPA fallback + nojekyll
        run: |
          cp dist/index.html dist/404.html
          mkdir -p dist/empire
          cp dist/index.html dist/empire/index.html
          mkdir -p dist/-
          cp dist/index.html dist/-/index.html
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Post-deploy smoke tests
        shell: bash
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          check_route() {
            local path="$1"
            local label="$2"
            local body status
            for attempt in {1..18}; do
              body="$(mktemp)"
              status="$(curl -L -sS -o "$body" -w '%{http_code}' "$base$path?smoke=$GITHUB_RUN_ID-$attempt" || true)"
              if [ "$status" = "200" ] && grep -q '<div id="root"' "$body" && grep -q '/assets/' "$body" && ! grep -q '/src/main.tsx' "$body"; then
                echo "✓ $label route served built SPA shell ($status)"
                rm -f "$body"
                return 0
              fi
              rm -f "$body"
              sleep 5
            done
            echo "✗ $label route failed smoke test"
            return 1
          }
          check_route "/" "home"
          check_route "/empire/" "empire hard-refresh"
